{% extends "admin_base.html" %}

{% block title %}Admin Login{% endblock %}

{% block content %}
<h1>Admin login</h1>
{% if error %}
  <div class="error">{{ error }}</div>
{% endif %}
<form method="post">
  <label for="password">Password</label>
  <input type="password" id="password" name="password" required>

  <button type="submit">Log in</button>
</form>
{% endblock %}
