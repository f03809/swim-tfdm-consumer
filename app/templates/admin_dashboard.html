{% extends "admin_base.html" %}

{% block admin_title %}Dashboard{% endblock %}

{% block admin_content %}
  <h1 class="page-title">Dashboard</h1>
  <p class="page-subtitle">Overview of the consumer.</p>

  <div class="admin-stats">
    <div class="admin-stat card">
      <i data-lucide="users" class="admin-stat-icon"></i>
      <div class="admin-stat-value">{{ client_count }}</div>
      <div class="admin-stat-label">Active clients</div>
    </div>
    <div class="admin-stat card">
      <i data-lucide="bell-ring" class="admin-stat-icon"></i>
      <div class="admin-stat-value">{{ subscription_count }}</div>
      <div class="admin-stat-label">Active subscriptions</div>
    </div>
  </div>
{% endblock %}
