[project]
name = "swim-tfdm-consumer"
version = "0.1.0"
description = "TFDM consumer, API, and UI for SWIM flight data"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "motor",
    "aiokafka",
    "pydantic>=2",
    "pydantic-settings",
    "jinja2",
    "pyjwt>=2.13.0",
    "bcrypt>=5.0.0",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "python-multipart>=0.0.32",
]

[project.optional-dependencies]
dev = ["httpx", "pytest", "pytest-asyncio"]

[tool.setuptools]
packages = ["app"]
