apiVersion: apps/v1
kind: Deployment
metadata:
  name: swim-tfdm-consumer-dispatcher
  namespace: swim
spec:
  replicas: 1
  selector:
    matchLabels:
      app: swim-tfdm-consumer-dispatcher
  template:
    metadata:
      labels:
        app: swim-tfdm-consumer-dispatcher
    spec:
      containers:
      - name: dispatcher
        image: swim-tfdm-consumer:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        env:
        - name: RUN_MODE
          value: "dispatcher"
        - name: MONGODB_URL
          value: "mongodb://10.0.0.16:27017,10.1.1.27:27017/?replicaSet=rs0"
        - name: MONGODB_DB
          value: "swim_tfdm_consumer"
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: swim-consumer-secrets
              key: JWT_SECRET
        - name: ADMIN_SESSION_SECRET
          valueFrom:
            secretKeyRef:
              name: swim-consumer-secrets
              key: ADMIN_SESSION_SECRET
